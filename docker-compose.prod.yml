# Production (VPS). Start with:  docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (80/443); the backend is internal.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /app/config/assignments
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    restart: unless-stopped
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    env_file: deploy/web.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
