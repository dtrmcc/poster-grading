# Local-only: ports are bound to 127.0.0.1 so nothing is reachable from the network.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /app/config/assignments
    volumes:
      - ./config:/app/config:ro
      - ./data:/data
      - ./backend/app:/app/app            # live code reload in development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama running on the Mac

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
